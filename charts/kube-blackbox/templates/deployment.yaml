apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-blackbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-blackbox.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "kube-blackbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-blackbox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-blackbox.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: recorder
          image: {{ include "kube-blackbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - recorder
            - {{ printf "--cluster=%s" .Values.clusterName | quote }}
            - --data-dir=/var/lib/kube-blackbox
            - {{ printf "--retention=%s" .Values.retention | quote }}
            - {{ printf "--max-store-bytes=%d" (int64 .Values.maxStoreBytes) | quote }}
            - {{ printf "--max-segment-bytes=%d" (int64 .Values.maxSegmentBytes) | quote }}
            {{- if .Values.includeConfigMaps }}
            - --include-configmaps=true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kube-blackbox
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kube-blackbox.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
