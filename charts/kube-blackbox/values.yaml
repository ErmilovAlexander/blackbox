image:
  # The image is stored in the dedicated hosted repository and exposed by the Nexus Docker group.
  repository: mirror.ip-10-28-32-189.shturval.link/kube-blackbox
  tag: "4faa2b2"
  digest: "sha256:5b7a52c94e04dbd65425db71da428f6a1175a10cf3b4c7596e204211e1c6d557"
  pullPolicy: IfNotPresent

# The Nexus Docker group currently permits anonymous pull.
# Add a namespace Secret only if that policy changes.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

clusterName: management
includeConfigMaps: false
retention: 24h
maxStoreBytes: 2147483648
maxSegmentBytes: 67108864

persistence:
  enabled: true
  # Preserve incident evidence when the Helm release is removed.
  keep: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

nodeSelector:
  kubernetes.io/arch: amd64
  node-role.kubernetes.io/infra: ""

tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
