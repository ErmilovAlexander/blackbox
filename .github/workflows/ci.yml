name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: azure/setup-helm@v4
      - run: go mod download
      - run: make verify
      - run: make image IMAGE=kube-blackbox:ci VERSION=ci PLATFORM=linux/amd64
