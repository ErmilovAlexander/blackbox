apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-blackbox
  namespace: kube-blackbox
  labels:
    app.kubernetes.io/name: kube-blackbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-blackbox-readonly
  labels:
    app.kubernetes.io/name: kube-blackbox
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "nodes", "persistentvolumeclaims", "persistentvolumes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-blackbox-readonly
  labels:
    app.kubernetes.io/name: kube-blackbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-blackbox-readonly
subjects:
  - kind: ServiceAccount
    name: kube-blackbox
    namespace: kube-blackbox
